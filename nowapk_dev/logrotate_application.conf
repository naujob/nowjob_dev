# NowJob 애플리케이션 로그 로테이션 설정
/website/nowapk/debug_log/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 apache apache
    su apache apache
    postrotate
        # 필요시 애플리케이션 재시작 명령어 추가
    endscript
}

/website/nowapk/chatting/chat/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 root root
    su root root
    postrotate
        # 필요시 채팅 서버 재시작 명령어 추가
    endscript
}

/website/nowapk/php_log/*/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 apache apache
    su apache apache
    postrotate
        # 필요시 애플리케이션 재시작 명령어 추가
    endscript
}
