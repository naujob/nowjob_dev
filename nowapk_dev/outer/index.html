  <!DOCTYPE html>
  <html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=460, user-scalable=no">
    <title>나우잡 업데이트 안내</title>
    <link rel="shortcut icon" href="https://nowjob.co.kr/outer/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/outer/favicon.ico" type="image/x-icon">    
    <style>
      body {
        margin:0;
        padding:0;
        background-color: rgb(87, 204, 175);
      }
      .body {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 15px;
        background: #fff;
        border-radius: 20px;
        width:90%;
        max-width:600px;
      }      
      .bg_img {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg_img_intro_bottom {
        background: url(https://nowjob.co.kr/outer/update.png) no-repeat bottom center;
        background-size: contain;
      }
      @media (max-width: 800px) {
        .body {
          top: 20%;
          width: 80%;
        }      
        .bg_img_intro_bottom {
          background: url(https://nowjob.co.kr/outer/update2.png) no-repeat bottom left;
          background-size: contain;
        }
      }      
      h1 { font-size: 28px; color: #333; }
      p { font-size: 18px; color: #666; }
    </style>
  </head>
  <body>
    <div class="bg_img bg_img_intro_bottom"></div>
    <div class="body">
      <img src="https://nowjob.co.kr/outer/top_logo.svg">
      <h1>현재 사이트 점검 중입니다</h1>
      <p>보다 나은 서비스를 제공하기 위하여<br>시스템 업데이트를 진행하고 있습니다.</p>
      <p>이용에 불편을 드려 죄송합니다.</p>
    </div>
  </body>
  </html>
