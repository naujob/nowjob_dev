<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사업자등록증 진위 확인</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { margin-bottom: 10px; width: 300px; padding: 5px; }
    label { display: block; margin-top: 10px; }
    button { padding: 8px 16px; margin-top: 10px; }
    #result { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>사업자등록증 진위 여부 확인</h2>

  <label>사업자등록번호 (10자리 숫자만):</label>
  <input type="text" id="b_no" maxlength="10" placeholder="예: 1234567890">

  <label>대표자 성명:</label>
  <input type="text" id="p_nm" placeholder="예: 홍길동">

  <label>개업일자 (YYYYMMDD):</label>
  <input type="text" id="start_dt" maxlength="8" placeholder="예: 20200101">

  <label>상호:</label>
  <input type="text" id="b_nm" placeholder="예: (주)나우 인터내셔널">

  <button onclick="checkBusiness()">확인하기</button>

  <div id="result"></div>

  <script>
    function checkBusiness() {
      const b_no = $("#b_no").val().replace(/[^0-9]/g, '');
      const p_nm = $("#p_nm").val().trim();
      const start_dt = $("#start_dt").val().replace(/[^0-9]/g, '');
      const b_nm = $("#b_nm").val().trim();

      if (!b_no || b_no.length !== 10 || !p_nm || !start_dt || !b_nm) {
        alert("필수 항목을 정확히 입력해 주세요.");
        return;
      }

      const data = {
        businesses: [
          {
            b_no: b_no,
            start_dt: start_dt,
            p_nm: p_nm,
            p_nm2: "",
            b_nm: b_nm,
            corp_no: "",
            b_sector: "",
            b_type: "",
            b_adr: ""
          }
        ]
      };

      $("#result").html("조회 중...");

      $.ajax({
        url: "https://api.odcloud.kr/api/nts-businessman/v1/validate?serviceKey=nbqW%2FFUs8GPs9gugbRl6wK2fqyEhU%2F4kDV1UzIEmA%2BgNYC9C1IyNsLwER%2FR5ALL5p20DpErEsQ2QlWm38oD%2FGA%3D%3D", 
      type: "POST",
      data: JSON.stringify(data),
      dataType: "JSON",
      contentType: "application/json",
      accept: "application/json",
      success: function(result) {
        const info = result.data[0];
        const status = info.status;

        const stateMap = {
          "01": "계속사업자",
          "02": "휴업자",
          "03": "폐업자"
        };

        const b_stt_cd = status?.b_stt_cd || "";
        const tax_type = status?.tax_type || "-";
        const b_stt = stateMap[b_stt_cd] || "알 수 없음";
        const 인증여부 = (b_stt_cd === "01") ? "인증사업자" : "미인증사업자";

        const output = `
          <b>사업자번호:</b> ${info.b_no}
          <b>대표자명:</b> ${info.request_param.p_nm}
          <b>상호:</b> ${info.request_param.b_nm}
          <b>개업일자:</b> ${info.request_param.start_dt}
          <b>상태:</b> ${b_stt}
          <b>과세유형:</b> ${tax_type}
          <b>인증결과:</b> ${인증여부}
        `;

        $("#result").html(output);
      },
      error: function(result) {
        $("#result").html("에러 발생:\n" + result.responseText);
      }
    });
  }
</script>
</body>
</html>
