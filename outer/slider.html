<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=460, user-scalable=no">
  <title>나우리 범위 슬라이더</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    .slider-container {
      position: relative;
      width: 300px;
      height: 40px;
    }
    .range-track {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 6px;
      background: #e1fff7;
      border-radius: 3px;
      transform: translateY(-50%);
    }
    .range-fill {
      position: absolute;
      top: 50%;
      height: 6px;
      background: #57ccaf;
      border-radius: 3px;
      transform: translateY(-50%);
      z-index: 1;
    }
    .handle {
      position: absolute;
      top: 50%;
      width: 28px;
      height: 28px;
      background: #57ccaf;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 2;
      color: #fff;
      font-size: 12px;
      line-height: 28px;
      text-align: center;
      font-weight: bold;
    }

  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>


<p>
  <label for="age">나이: </label>
  <input type="text" id="age" readonly style="border:0; color:#57ccaf; font-weight:bold;">
</p>
<div class="slider-container"
     data-smin="20" data-smax="70"
     data-emin="29" data-emax="79"
     data-step="10" data-displayid="age"
     data-text="대">
  <div class="range-track"></div>
  <div class="range-fill"></div>
  <div class="handle handle-min" data-min="20"></div>
  <div class="handle handle-max" data-max="79"></div>
</div>

<script>

$(function() {
  $('.slider-container').nauriRangeSlider();
});


(function($) {
  $.fn.nauriRangeSlider = function() {
    return this.each(function() {
      const $slider = $(this);
      const $fill = $slider.find('.range-fill');
      const $handleMin = $slider.find('.handle-min');
      const $handleMax = $slider.find('.handle-max');

      const SminLimit = parseInt($slider.data('smin'));
      const SmaxLimit = parseInt($slider.data('smax'));
      const EminLimit = parseInt($slider.data('emin'));
      const EmaxLimit = parseInt($slider.data('emax'));
      const outputText = $slider.data('text');
      const step = parseInt($slider.data('step')) || 1;
      const $display = $('#' + $slider.data('displayid'));

      const width = $slider.width();

      let currentMin = parseInt($handleMin.data('min')) || SminLimit;
      let currentMax = parseInt($handleMax.data('max')) || EmaxLimit;

      currentMin = Math.max(SminLimit, Math.min(currentMin, SmaxLimit));
      currentMax = Math.max(EminLimit, Math.min(currentMax, EmaxLimit));

      function valToX(val) {
        return ((val - SminLimit) / (EmaxLimit - SminLimit)) * width;
      }

      function xToVal(x, type) {
        const ratio = Math.min(Math.max(x / width, 0), 1);
        const raw = SminLimit + ratio * (EmaxLimit - SminLimit);

        if (type === 'min') {
          let value = Math.round(raw / step) * step;
          return Math.max(SminLimit, Math.min(value, SmaxLimit));
        } else {
          let base = EminLimit;
          let offset = raw - base;
          let stepped = Math.round(offset / step) * step;
          let value = base + stepped;
          return Math.max(EminLimit, Math.min(value, EmaxLimit));
        }
      }

      function updateUI() {
        const xMin = valToX(currentMin);
        const xMax = valToX(currentMax);

        $handleMin.css('left', xMin + 'px').text(currentMin);
        $handleMax.css('left', xMax + 'px').text(currentMax);
        $handleMin.attr('data-min', currentMin);
        $handleMax.attr('data-max', currentMax);    

        const fillLeft = Math.min(xMin, xMax);
        const fillRight = Math.max(xMin, xMax);

        $fill.css({
          left: fillLeft + 'px',
          width: (fillRight - fillLeft) + 'px'
        });

        const valueText = currentMin + ' ~ ' + currentMax + outputText;
        
        if ($display && $display.length) {
          $display.val(valueText);
        }
      }

      function setupDrag($handle, isMin) {
        $handle.on('mousedown touchstart', function(e) {
          e.preventDefault();

          $(document).on('mousemove.slider touchmove.slider', function(eMove) {
            const clientX = eMove.type.startsWith('touch')
              ? eMove.originalEvent.touches[0].clientX
              : eMove.clientX;

            const rect = $slider[0].getBoundingClientRect();
            const x = clientX - rect.left;

            const val = xToVal(x, isMin ? 'min' : 'max');

            if (isMin) {
              if (val < currentMax) currentMin = val;
            } else {
              if (val > currentMin) currentMax = val;
            }

            updateUI();
          });

          $(document).on('mouseup.slider touchend.slider', function() {
            $(document).off('.slider');
          });
        });
      }

      setupDrag($handleMin, true);
      setupDrag($handleMax, false);
      updateUI();
    });
  };
})(jQuery);

</script>

</body>
</html>
